<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fırınna Site Yönetimi</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #f4f4f5; color: #333; margin: 0; padding: 0; }
        .container { max-width: 600px; margin: 40px auto; background: #fff; padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #1a1a1a; margin-top: 0; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 0.9rem; }
        input, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-family: inherit; box-sizing: border-box; }
        input:focus, textarea:focus { outline: 2px solid #f1c40f; }
        button { width: 100%; padding: 12px; background: #1a1a1a; color: #fff; border: none; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; }
        button:hover { background: #333; }
        .result { margin-top: 12px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🌐 Site Yönetim Paneli</h2>
        <form id="settingsForm" onsubmit="saveSettings(event)">
            <div class="form-group">
                <label>Çalışma Saatleri (Örn: 08:00 - 23:00)</label>
                <input type="text" id="work_hours" required>
            </div>
            <div class="form-group">
                <label>Adres</label>
                <textarea id="address" rows="3" required></textarea>
            </div>
            <div class="form-group">
                <label>Telefon Numarası (Sadece Rakamlar, 90...)</label>
                <input type="text" id="phone" required>
            </div>
            <div class="form-group">
                <label>Instagram Linki</label>
                <input type="url" id="instagram" required>
            </div>
            <div class="form-group">
                <label>Baidu Harita Linki</label>
                <input type="url" id="baidu" required>
            </div>
            <button type="submit">Ayarları Kaydet</button>
            <p id="resultMsg" class="result"></p>
        </form>
    </div>

    <script>
        async function fetchSettings() {
            try {
                const res = await fetch('/api/web/settings');
                const data = await res.json();
                document.getElementById('work_hours').value = data.work_hours || '';
                document.getElementById('address').value = data.address || '';
                document.getElementById('phone').value = data.phone || '';
                document.getElementById('instagram').value = data.instagram || '';
                document.getElementById('baidu').value = data.baidu || '';
            } catch (err) {
                console.error(err);
            }
        }

        async function saveSettings(e) {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const msg = document.getElementById('resultMsg');
            btn.disabled = true;
            btn.innerText = "Kaydediliyor...";
            
            const data = {
                work_hours: document.getElementById('work_hours').value,
                address: document.getElementById('address').value,
                phone: document.getElementById('phone').value,
                instagram: document.getElementById('instagram').value,
                baidu: document.getElementById('baidu').value
            };

            try {
                const response = await fetch('/api/web/settings', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await response.json();
                if (result.success) {
                    msg.style.color = "green";
                    msg.innerText = "Ayarlar başarıyla güncellendi! Ana sayfada anında geçerli olacaktır.";
                } else {
                    msg.style.color = "red";
                    msg.innerText = "Bir hata oluştu.";
                }
            } catch (err) {
                msg.style.color = "red";
                msg.innerText = "Bağlantı hatası.";
            }
            btn.disabled = false;
            btn.innerText = "Ayarları Kaydet";
            setTimeout(() => { msg.innerText = ''; }, 4000);
        }

        // Sayfa yüklenince mevcut ayarları getir
        fetchSettings();
    </script>
</body>
</html>
