<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>Fırınna TV (Dijital Tabela)</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; text-align: center; padding: 50px 20px; background: #070a13; color: #fff; margin: 0; }
        #splash { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #070a13; display: flex; align-items: center; justify-content: center; flex-direction: column; color: white; z-index: 9999; }
        #splash h1 { font-size: 3rem; margin: 0; letter-spacing: 2px; color: #2d6a4f; }
        #splash p { margin: 10px 0 0; opacity: 0.85; font-size: 1.1rem; }
        .spinner { width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.1); border-top-color: #2d6a4f; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="splash">
        <div class="spinner"></div>
        <h1>FIRINNA TV</h1>
        <p id="statusMsg">Sunucuya bağlanıyor (192.168.1.2)...</p>
        <small id="retryMsg" style="margin-top:10px; color:#94a3b8; font-size:0.85rem;"></small>
    </div>

    <script>
        const PRIMARY_LAN_IP = "192.168.1.2";
        const PRIMARY_SERVER_URL = "http://" + PRIMARY_LAN_IP + ":5000";
        const WAN_FALLBACK_URL = "https://pos.firinna.com";
        const MAX_LAN_RETRIES = 15;
        let retryCount = 0;

        function checkAndConnect() {
            retryCount++;
            const statusMsg = document.getElementById('statusMsg');
            const retryMsg = document.getElementById('retryMsg');

            if (retryCount <= MAX_LAN_RETRIES) {
                statusMsg.textContent = `Sunucuya bağlanıyor (${PRIMARY_LAN_IP})...`;
                retryMsg.textContent = `Yerel ağ denemesi: ${retryCount} / ${MAX_LAN_RETRIES}`;

                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 2000);

                fetch(PRIMARY_SERVER_URL + "/api/tv/settings", { signal: controller.signal })
                    .then(r => {
                        clearTimeout(timeoutId);
                        if (r.ok) {
                            window.location.replace(PRIMARY_SERVER_URL + "/tv-player");
                        } else {
                            throw new Error("HTTP " + r.status);
                        }
                    })
                    .catch(err => {
                        clearTimeout(timeoutId);
                        // Retry next
                        setTimeout(checkAndConnect, 1000);
                    });
            } else {
                // After 15 failed retries, switch to WAN domain fallback
                statusMsg.textContent = "Yerel sunucu bulunamadı, WAN üzerinden bağlanılıyor...";
                retryMsg.textContent = WAN_FALLBACK_URL;
                setTimeout(() => {
                    window.location.replace(WAN_FALLBACK_URL + "/tv-player");
                }, 1000);
            }
        }

        // Start connection immediately
        checkAndConnect();
    </script>
</body>
</html>
