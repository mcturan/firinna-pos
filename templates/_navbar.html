    <div style="display:flex; align-items:center; gap:0.6rem; min-width:200px;">
        <span style="font-size:1.1rem;" id="navRadioIcon">📻</span>
        <a href="/radio" style="color:#f8fafc; font-weight:700; text-decoration:none; display:flex; align-items:center; gap:6px;" title="Radyo & Müzik Yönetimini Aç">
            <span id="navRadioTitle" style="max-width:260px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">Power FM</span>
            <span id="navRadioModeBadge" style="background:#334155; color:#94a3b8; font-size:0.7rem; padding:1px 6px; border-radius:4px;">🔁 Sıralı</span>
        </a>
    </div>

    <!-- Oynatma Kontrolleri -->
    <div style="display:flex; align-items:center; gap:0.4rem;">
        <button onclick="navRadioControl('prev')" style="background:transparent; border:none; color:#cbd5e1; cursor:pointer; font-size:0.9rem; padding:2px 6px;" title="Önceki">⏮</button>

            <button onclick="navToggleWebMute()" id="navWebMuteBtn" style="background:none; border:none; color:#94a3b8; cursor:pointer; font-size:0.95rem; padding:0;" title="Web Sesini Aç/Kapa">🔇</button>

<audio id="globalNavbarAudio" preload="none"></audio>

<script>
(function initGlobalRadioNavbar() {
    var navAud = document.getElementById('globalNavbarAudio');
    var navVol = localStorage.getItem('firinna_web_volume') !== null ? parseInt(localStorage.getItem('firinna_web_volume')) : 0;
    var navMuted = localStorage.getItem('firinna_web_muted') === 'true' || navVol === 0;

    function applyNavVol() {
        if (!navAud) return;
        var slider = document.getElementById('navWebVolSlider');
        var label = document.getElementById('navWebVolLabel');
        var btn = document.getElementById('navWebMuteBtn');
        if (navMuted || navVol === 0) {
            navAud.volume = 0;
            if (slider) slider.value = 0;
            if (label) label.textContent = '%0';
            if (btn) btn.textContent = '🔇';
        } else {
            navAud.volume = navVol / 100;
            if (slider) slider.value = navVol;
            if (label) label.textContent = '%' + navVol;
            if (btn) btn.textContent = '🔊';
        }
    }

    window.navSetWebVolume = function(val) {
        navVol = parseInt(val);
        localStorage.setItem('firinna_web_volume', navVol);
        navMuted = (navVol === 0);
        localStorage.setItem('firinna_web_muted', navMuted ? 'true' : 'false');
        applyNavVol();
    };

    window.navToggleWebMute = function() {
        if (navMuted) {
            navMuted = false;
            navVol = (navVol === 0 ? 50 : navVol);
        } else {
            navMuted = true;
        }
        localStorage.setItem('firinna_web_muted', navMuted ? 'true' : 'false');
        localStorage.setItem('firinna_web_volume', navVol);
        applyNavVol();
    };

    var currentRadioState = {};

    window.syncNavRadio = async function() {
        try {
            var r = await fetch('/api/radio/status');
            var st = await r.json();
            currentRadioState = st;
            
            var titleEl = document.getElementById('navRadioTitle');
            var btnEl = document.getElementById('navRadioPlayBtn');
            var badgeEl = document.getElementById('navRadioModeBadge');
            
            if (titleEl) titleEl.textContent = st.current_title || 'Hazır';
            if (btnEl) {
                if (st.is_playing) {
                    btnEl.textContent = '⏸ Durdur';
                    btnEl.style.background = '#2563eb';
                } else {
                    btnEl.textContent = '▶ Çal';
                    btnEl.style.background = '#2d6a4f';
                }
            }
            if (badgeEl) {
                badgeEl.textContent = st.mode === 'shuffle' ? '🔀 Karışık' : '🔁 Sıralı';
            }

            // Sync Web Audio Element (only if not on /radio page, which has its own player)
            if (window.location.pathname !== '/radio') {
                if (st.is_playing && st.current_url) {
                    if (navAud.src !== st.current_url && !navAud.src.endsWith(st.current_url)) {
                        navAud.src = st.current_url;
                        navAud.load();
                    }
                    if (navAud.paused) {
                        navAud.play().catch(function(e){});
                    }
                } else {
                    if (!navAud.paused) navAud.pause();
                }
            }
        } catch(e){}
    };

    window.navRadioTogglePlay = function() {
        var act = currentRadioState.is_playing ? 'pause' : 'play';
        fetch('/api/radio/control', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({action: act})
        }).then(function(){ syncNavRadio(); });
    };

    window.navRadioControl = function(act) {
        fetch('/api/radio/control', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({action: act})
        }).then(function(){ syncNavRadio(); });
    };

    if (navAud) {
        navAud.onended = function() {
            window.navRadioControl('next');
        };
    }

    applyNavVol();
    syncNavRadio();
    setInterval(syncNavRadio, 5000);
})();
</script>

<div class="alert-panel" id="alertPanel">
    <div class="alert-panel-header">
        <span>Stok Uyarıları</span>
        <a href="/stok" style="color:white;font-size:.82rem;font-weight:700;text-decoration:none;background:rgba(255,255,255,.2);padding:.2rem .65rem;border-radius:12px;">Stoka Git →</a>
    </div>
    <div class="alert-panel-body" id="alertPanelBody">
        <div class="alert-empty">Yükleniyor...</div>
    </div>
</div>

<script>
function toggleTheme() {
    var isDark = document.body.classList.toggle('dark-mode');
    localStorage.setItem('theme', isDark ? 'dark' : 'light');
    updateThemeIcons();
}
function updateThemeIcons() {
    var isDark = document.body.classList.contains('dark-mode');
    var sun = document.querySelector('#themeToggleBtn .sun-icon');
    var moon = document.querySelector('#themeToggleBtn .moon-icon');
    if (sun && moon) {
        if (isDark) {
            sun.style.display = 'block';
            moon.style.display = 'none';
        } else {
            sun.style.display = 'none';
            moon.style.display = 'block';
        }
    }
}
document.addEventListener('DOMContentLoaded', updateThemeIcons);
if (document.readyState === 'complete' || document.readyState === 'interactive') {
    updateThemeIcons();
}

function toggleNav() { document.getElementById('navDropdown').classList.toggle('open'); }
document.addEventListener('click', function(e) {
    var dd = document.getElementById('navDropdown');
    var p  = document.getElementById('alertPanel');
    var b  = document.getElementById('alertBtn');
    if (dd && !dd.contains(e.target)) dd.classList.remove('open');
    if (p && b && !p.contains(e.target) && !b.contains(e.target)) p.classList.remove('open');
});
function toggleAlertPanel() {
    var badge = document.getElementById('alertBadge');
    if (badge && badge.style.display !== 'none' && parseInt(badge.textContent) > 0) { window.location.href = '/stok'; return; }
    document.getElementById('alertPanel').classList.toggle('open');
}
async function loadAlerts() {
    try {
        var items = await fetch('/api/stock/alerts').then(r => r.json());
        var badge = document.getElementById('alertBadge');
        var body  = document.getElementById('alertPanelBody');
        if (!badge || !body) return;
        if (items.length > 0) {
            badge.textContent = items.length;
            badge.style.display = 'flex';
            body.innerHTML = items.map(function(i) {
                var minText = i.min_quantity > 0 ? '<span class="min"> / min ' + Number(i.min_quantity).toFixed(1) + '</span>' : '';
                return '<div class="alert-item"><span class="alert-item-name">' + i.name + '</span>'
                    + '<span class="alert-item-qty"><span class="cur">' + Number(i.current_qty).toFixed(1) + ' ' + i.unit + '</span>' + minText + '</span></div>';
            }).join('');
        } else {
            badge.style.display = 'none';
            body.innerHTML = '<div class="alert-empty">Tüm stoklar yeterli</div>';
        }
    } catch(e) {}
}
loadAlerts();
setInterval(loadAlerts, 60000);
(function loadNavLogo() {
    fetch('/api/settings/logo').then(function(r){ return r.json(); }).then(function(d) {
        if (d.url) {
            var img = document.getElementById('navLogoImg');
            var svg = document.getElementById('navLogoFallback');
            if (img && svg) {
                img.src = d.url;
                img.style.display = 'block';
                svg.style.display = 'none';
            }
        }
    }).catch(function(){});
})();
</script>

<div id="toast-container"></div>
<div id="confirm-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9000;align-items:center;justify-content:center;">
    <div style="background:white;border-radius:14px;padding:1.75rem;min-width:300px;max-width:420px;box-shadow:0 8px 32px rgba(0,0,0,.18);">
        <p id="confirm-msg" style="margin:0 0 1.5rem;font-size:1rem;color:#2d3748;line-height:1.5;white-space:pre-line;"></p>
        <div style="display:flex;gap:.75rem;justify-content:flex-end;">
            <button id="confirm-no"  onclick="document.getElementById('confirm-modal').style.display='none'" style="padding:.55rem 1.25rem;border:2px solid #e2e8f0;background:white;border-radius:8px;font-weight:600;cursor:pointer;color:#4a5568;">İptal</button>
            <button id="confirm-yes" style="padding:.55rem 1.5rem;background:#e53e3e;color:white;border:none;border-radius:8px;font-weight:600;cursor:pointer;">Sil</button>
        </div>
    </div>
</div>
<script>
function showConfirm(msg, fn, yesTxt, yesCls) {
    var m = document.getElementById('confirm-modal');
    document.getElementById('confirm-msg').textContent = msg;
    var yesBtn = document.getElementById('confirm-yes');
    yesBtn.textContent = yesTxt || 'Sil';
    yesBtn.style.background = yesCls || '#e53e3e';
    m.style.display = 'flex';
    yesBtn.onclick = function() { m.style.display = 'none'; fn(); };
}
function fmtN(n, dec) {
    dec = (dec === undefined) ? 2 : dec;
    return Number(n||0).toLocaleString('tr-TR', {minimumFractionDigits:dec, maximumFractionDigits:dec});
}
function fmtTL(n) { return fmtN(n) + ' ₺'; }
function showToast(msg, type, duration) {
    type = type || 'success';
    duration = duration || 3000;
    var c = document.getElementById('toast-container');
    var t = document.createElement('div');
    t.className = 'toast toast-' + type;
    t.textContent = msg;
    c.appendChild(t);
    setTimeout(function() {
        t.style.opacity = '0';
        t.style.transition = 'opacity .3s';
        setTimeout(function() { t.remove(); }, 300);
    }, duration);
}
</script>
