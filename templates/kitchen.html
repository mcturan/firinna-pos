<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mutfak — Fırınna POS</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <style>
        * { box-sizing:border-box; margin:0; padding:0; }
        body { background:#f0fdf4; color:#1a202c; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; min-height:100vh; }
        .kds-header { display:flex; justify-content:space-between; align-items:center; padding:.85rem 1.5rem; background:#2d6a4f; border-bottom:3px solid #1b4332; box-shadow:0 2px 8px rgba(45,106,79,.25); }
        .kds-title { font-size:1.2rem; font-weight:800; color:#fff; letter-spacing:.2px; }
        .kds-meta { display:flex; gap:1.25rem; align-items:center; font-size:.82rem; color:#d1fae5; }
        .kds-meta a { color:#a7f3d0; text-decoration:none; font-weight:600; padding:.25rem .6rem; background:rgba(255,255,255,.15); border-radius:8px; }
        .kds-meta a:hover { background:rgba(255,255,255,.25); }
        .kds-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:1.1rem; padding:1.25rem; align-items:start; }
        .kds-card { background:#fff; border-radius:14px; border:2px solid #d1fae5; padding:1.1rem; display:flex; flex-direction:column; box-shadow:0 2px 8px rgba(45,106,79,.08); }
        .kds-card.urgent-card { border-color:#fca5a5; background:#fff5f5; box-shadow:0 2px 12px rgba(239,68,68,.15); }
        .kds-card-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:.85rem; gap:.5rem; }
        .kds-table { font-size:1.05rem; font-weight:800; color:#2d6a4f; }
        .kds-card.urgent-card .kds-table { color:#dc2626; }
        .kds-elapsed { font-size:.78rem; font-weight:700; padding:.22rem .6rem; border-radius:20px; background:#d1fae5; color:#065f46; white-space:nowrap; }
        .kds-elapsed.urgent { background:#fee2e2; color:#991b1b; }
        .kds-items { flex:1; }
        .kds-item { display:flex; gap:.5rem; align-items:flex-start; padding:.45rem 0; border-bottom:1px solid #f0fdf4; }
        .kds-item:last-child { border-bottom:none; }
        .kds-qty { font-weight:800; color:#2d6a4f; min-width:26px; font-size:.95rem; }
        .kds-card.urgent-card .kds-qty { color:#dc2626; }
        .kds-name { font-size:.92rem; color:#2d3748; line-height:1.3; font-weight:600; }
        .kds-note { font-size:.74rem; color:#e53e3e; font-style:italic; margin-top:.15rem; }
        .kds-ready-btn { margin-top:1rem; width:100%; padding:.8rem; background:#2d6a4f; color:white; border:none; border-radius:10px; font-size:1rem; font-weight:700; cursor:pointer; transition:background .15s; font-family:inherit; }
        .kds-ready-btn:hover { background:#1b4332; }
        .kds-card.urgent-card .kds-ready-btn { background:#dc2626; }
        .kds-card.urgent-card .kds-ready-btn:hover { background:#b91c1c; }
        .kds-empty { grid-column:1/-1; text-align:center; padding:5rem 2rem; color:#a0aec0; font-size:1.1rem; }
        .kds-empty span { display:block; font-size:3rem; margin-bottom:1rem; }
        @media(max-width:640px) {
            .kds-grid { grid-template-columns:1fr; padding:.75rem; gap:.75rem; }
            .kds-header { padding:.7rem 1rem; }
            .kds-title { font-size:1rem; }
        }
    </style>
</head>
<body>
<div class="kds-header">
    <div style="display:flex;align-items:center;gap:.75rem;">
        <img id="kdsLogo" src="" alt="" style="display:none;max-height:36px;max-width:80px;object-fit:contain;border-radius:6px;background:rgba(255,255,255,.15);padding:2px;" onerror="this.style.display='none'">
        <div class="kds-title" id="kdsTitle">👨‍🍳 Mutfak Ekranı</div>
    </div>
    <div class="kds-meta">
        <span id="orderCount"></span>
        <span id="lastRefresh"></span>
        <span id="clockEl"></span>
        <a href="/">← POS</a>
    </div>
</div>
<div id="kdsGrid" class="kds-grid"></div>

<script>
function elapsedStr(created_at) {
    const ts = created_at.includes('T') ? created_at : created_at.replace(' ','T') + 'Z';
    const diff = Math.floor((Date.now() - new Date(ts).getTime()) / 1000);
    if (diff < 0) return '0s';
    const m = Math.floor(diff / 60), s = diff % 60;
    return m > 0 ? m + 'dk ' + s + 's' : s + 's';
}
function isUrgent(created_at) {
    const ts = created_at.includes('T') ? created_at : created_at.replace(' ','T') + 'Z';
    return (Date.now() - new Date(ts).getTime()) > 15 * 60 * 1000;
}

let _orders = [];

async function loadKitchen() {
    try {
        _orders = await fetch('/api/kitchen/orders').then(r => r.json());
    } catch(e) { return; }
    renderKitchen();
    document.getElementById('lastRefresh').textContent = 'Güncellendi: ' + new Date().toLocaleTimeString('tr-TR');
    document.getElementById('orderCount').textContent = _orders.length ? _orders.length + ' sipariş bekliyor' : '';
}

function renderKitchen() {
    const grid = document.getElementById('kdsGrid');
    if (!_orders.length) {
        grid.innerHTML = '<div class="kds-empty"><span>✅</span>Hazırlanacak sipariş yok</div>';
        return;
    }
    grid.innerHTML = _orders.map(o => `
        <div class="kds-card${isUrgent(o.created_at) ? ' urgent-card' : ''}">
            <div class="kds-card-header">
                <span class="kds-table">🍽️ ${o.table_name}</span>
                <span class="kds-elapsed${isUrgent(o.created_at) ? ' urgent' : ''}" data-ts="${o.created_at}">${elapsedStr(o.created_at)}</span>
            </div>
            <div class="kds-items">
                ${o.items.map(i => `
                    <div class="kds-item">
                        <span class="kds-qty">${i.quantity}×</span>
                        <div>
                            <div class="kds-name">${i.product_name}</div>
                            ${i.kitchen_notes ? '<div class="kds-note">📝 ' + i.kitchen_notes + '</div>' : ''}
                        </div>
                    </div>`).join('')}
            </div>
            <button class="kds-ready-btn" onclick="markReady(${o.id})">✓ Hazırlandı</button>
        </div>`).join('');
}

async function markReady(orderId) {
    await fetch('/api/kitchen/orders/' + orderId + '/ready', {method:'POST'});
    _orders = _orders.filter(o => o.id !== orderId);
    renderKitchen();
}

function updateElapsed() {
    document.querySelectorAll('.kds-elapsed[data-ts]').forEach(el => {
        const ts = el.getAttribute('data-ts');
        el.textContent = elapsedStr(ts);
        el.className = 'kds-elapsed' + (isUrgent(ts) ? ' urgent' : '');
    });
}

function updateClock() {
    document.getElementById('clockEl').textContent = new Date().toLocaleTimeString('tr-TR');
}

async function loadKitchenHeader() {
    try {
        const [logoData, nameData] = await Promise.all([
            fetch('/api/settings/logo').then(r=>r.json()).catch(()=>({})),
            fetch('/api/settings/restaurant_name').then(r=>r.json()).catch(()=>({}))
        ]);
        const name = nameData.value || 'Mutfak';
        document.getElementById('kdsTitle').textContent = '👨\u200d🍳 ' + name + ' — Mutfak';
        if (logoData.url) {
            const img = document.getElementById('kdsLogo');
            img.src = logoData.url;
            img.style.display = 'block';
        }
    } catch(e) {}
}

loadKitchen();
loadKitchenHeader();
setInterval(loadKitchen, 3000); // 3 saniyede bir mutfak ekranını yenile (Anlık)
setInterval(updateElapsed, 5000);
setInterval(updateClock, 1000);
updateClock();
</script>
</body>
</html>
