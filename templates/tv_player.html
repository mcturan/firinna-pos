<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Dijital Tabela</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        
        @keyframes meshAnimation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        body, html { 
            margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; 
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(-45deg, #fdfbfb, #ebedee, #f3e7e9, #e3eeff);
            background-size: 400% 400%;
            animation: meshAnimation 12s ease infinite;
            color: #1A1A1A;
        }

        /* Legacy Layout (Default & Sidebar) */
        body.layout-default #video-container, body.layout-sidebar #video-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; background:#000; }
        body.layout-sidebar #video-container { width: 75%; }
        
        /* Modern Grid Layout */
        #modern-layout { display: none; width: 100vw; height: 100vh; padding: 1.5vw; padding-bottom: 0; box-sizing: border-box; grid-template-columns: 3fr 4fr 3fr; grid-template-rows: 12vh 1fr 6vh; gap: 1.5vw; }
        body.layout-modern_grid #modern-layout { display: grid; }
        body.layout-modern_grid #legacy-overlay { display: none; }
        body.layout-modern_grid #sidebar { display: none; }
        body.layout-modern_grid #video-container { position: relative; width: 100%; height: 100%; border-radius: 1vw; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.2); background: #000; }
        
        .grid-box { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(10px); border-radius: 1vw; box-shadow: 0 4px 15px rgba(0,0,0,0.05); display: flex; align-items: center; justify-content: center; overflow: hidden; border: 2px solid rgba(255,255,255,0.5); }
        
        /* Modern Grid Areas */
        #ml-top-left { grid-column: 1; grid-row: 1; font-size: 2.5vw; font-weight: 800; color: #2d6a4f; justify-content: flex-start; padding-left: 2vw;}
        #ml-top-center { grid-column: 2; grid-row: 1; }
        #ml-top-right { grid-column: 3; grid-row: 1; flex-direction: column; align-items: flex-end; padding-right: 2vw; text-align: right; }
        
        #ml-main-left { grid-column: 1; grid-row: 2; display: flex; flex-direction: column; gap: 1.5vw; background: transparent; box-shadow: none; border: none; backdrop-filter: none; }
        
        #ml-left-top { flex: 2; background: rgba(255, 255, 255, 0.9); border-radius: 1vw; box-shadow: 0 8px 20px rgba(0,0,0,0.08); display: flex; flex-direction: column; overflow: hidden; position: relative; }
        #ml-left-bottom { flex: 1; background: #2d6a4f; color: white; border-radius: 1vw; box-shadow: 0 8px 20px rgba(0,0,0,0.1); padding: 2vw; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 2vw; font-weight: 700; position: relative; }
        
        #ml-main-video { grid-column: 2 / span 2; grid-row: 2; position: relative; }
        
        /* Product Carousel */
        .product-slide { position: absolute; inset: 0; display: flex; flex-direction: column; opacity: 0; transition: opacity 1s ease; }
        .product-slide.active { opacity: 1; }
        .prod-img { width: 100%; height: 50%; object-fit: cover; }
        .prod-info { padding: 1.5vw; flex: 1; display: flex; flex-direction: column; }
        .prod-title { font-size: 2vw; font-weight: 800; margin-bottom: 0.5vw; color: #1a202c; }
        .prod-desc { font-size: 1.2vw; color: #4a5568; margin-bottom: 1vw; flex: 1; }
        .prod-tags { display: flex; gap: 0.5vw; flex-wrap: wrap; }
        .prod-tag { font-size: 0.8vw; background: #edf2f7; padding: 0.3vw 0.8vw; border-radius: 1vw; font-weight: 600; color: #2d3748; text-transform: uppercase; }
        .prod-price { font-size: 2.2vw; font-weight: 800; color: #e53e3e; text-align: right; margin-top: auto; }

        /* Messages Fade */
        .msg-slide { position: absolute; inset: 2vw; display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 1.5s ease; }
        .msg-slide.active { opacity: 1; }
        
        /* Ticker Top Right */
        .tr-domain { font-size: 1.5vw; font-weight: 800; color: #2d6a4f; margin-bottom: 0.5vw; text-transform: uppercase; }
        .tr-flags { display: flex; gap: 0.8vw; justify-content: flex-end; }
        .tr-flags img { height: 1.8vw; border-radius: 0.2vw; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }

        /* Modern Bottom Ticker */
        #ml-bottom-ticker { grid-column: 1 / span 3; grid-row: 3; background: #2d6a4f; border-radius: 1vw 1vw 0 0; color: white; display: flex; align-items: center; overflow: hidden; font-size: 1.8vw; font-weight: 600; text-transform: uppercase; white-space: nowrap; }
        .ml-ticker-anim { display: inline-block; padding-left: 100%; animation: ticker 25s linear infinite; text-shadow: 1px 1px 3px rgba(0,0,0,0.5); }

        /* Record Animation */
        #record-player { position: absolute; top: 2vw; right: 2vw; width: 6vw; height: 6vw; background: url('/static/img/record.png') no-repeat center/cover; border-radius: 50%; z-index: 10; display: none; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .spinning { animation: spin 4s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Legacy Overlays */
        #ytplayer, #local-video { width: 100%; height: 100%; border: none; }
        #local-video { object-fit: cover; }
        #legacy-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; }
        .logo { position: absolute; top: 40px; right: 40px; max-width: 250px; max-height: 120px; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5)); }
        .ticker-wrap { position: absolute; bottom: 0; width: 100%; height: 70px; background: rgba(0, 0, 0, 0.75); display: flex; align-items: center; overflow: hidden; box-shadow: 0 -5px 15px rgba(0,0,0,0.5); border-top: 3px solid #2d6a4f; pointer-events: auto; }
        .ticker-title { background: #2d6a4f; color: white; padding: 0 30px; height: 100%; display: flex; align-items: center; font-weight: 800; font-size: 1.5rem; z-index: 2; white-space: nowrap; text-transform: uppercase; letter-spacing: 2px; }
        .ticker-content { white-space: nowrap; font-size: 2.2rem; color: #fff; font-weight: 600; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); animation: ticker 25s linear infinite; padding-left: 100%; display: inline-block; }
        @keyframes ticker { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }
        .widgets { position: absolute; bottom: 90px; right: 40px; display: flex; flex-direction: column; gap: 20px; align-items: flex-end; }
        .qr-box { background: rgba(255,255,255,0.9); padding: 15px; border-radius: 12px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .qr-box img { width: 120px; height: 120px; display: block; margin: 0 auto;}
        .qr-text { color: #000; font-weight: 800; font-size: 1.1rem; margin-top: 10px; }
        .clock-widget { background: rgba(0,0,0,0.6); padding: 15px 30px; border-radius: 12px; color: white; font-size: 3rem; font-weight: 700; backdrop-filter: blur(5px); border: 2px solid rgba(255,255,255,0.2); text-shadow: 0 2px 5px rgba(0,0,0,0.8); }
        
        body.layout-sidebar .sidebar { position: absolute; top: 0; right: 0; width: 25%; height: calc(100% - 70px); background: #1a202c; z-index: 5; display: flex; flex-direction: column; align-items: center; padding: 40px 20px; box-sizing: border-box; border-left: 2px solid #2d3748; }
        body.layout-sidebar .widgets { position: static; margin-top: auto; align-items: center; }
        body.layout-sidebar .logo { position: static; max-width: 80%; margin-bottom: 40px; filter: none; }
        .sidebar { display: none; }
        body.layout-sidebar .sidebar { display: flex; }
    </style>
</head>
<body class="layout-modern_grid">

    <!-- MODERN GRID LAYOUT -->
    <div id="modern-layout">
        <!-- Top Row -->
        <div class="grid-box" id="ml-top-left">
            <span id="ml-clock">00:00</span>
            <div id="ml-weather" style="margin-left:1.5vw; font-size:1.2vw; display:flex; flex-direction:column; line-height:1.2;">
                <span>Yükleniyor...</span>
            </div>
        </div>
        <div class="grid-box" id="ml-top-center">
            <img id="ml-logo" src="" style="max-height:80%; max-width:80%; display:none;">
        </div>
        <div class="grid-box" id="ml-top-right" style="justify-content:center;">
            <div class="tr-domain">FIRINNA MENU: www.firinna.com</div>
            <div class="tr-flags">
                <img src="https://flagcdn.com/w40/tr.png" alt="TR">
                <img src="https://flagcdn.com/w40/gb.png" alt="EN">
                <img src="https://flagcdn.com/w40/sa.png" alt="AR">
                <img src="https://flagcdn.com/w40/ru.png" alt="RU">
            </div>
        </div>

        <!-- Main Content Row -->
        <div id="ml-main-left">
            <div id="ml-left-top">
                <div id="product-carousel" style="width:100%; height:100%; position:relative;"></div>
            </div>
            <div id="ml-left-bottom">
                <div id="message-carousel" style="width:100%; height:100%; position:relative;"></div>
            </div>
        </div>

        <div id="ml-main-video">
            <div id="video-container">
                <div id="ytplayer" style="display:none;"></div>
                <video id="local-video" style="display:none;" autoplay muted playsinline></video>
            </div>
            <div id="record-player"></div>
        </div>

        <div id="ml-bottom-ticker">
            <div class="ml-ticker-anim" id="ml-ticker-text">Yükleniyor...</div>
        </div>
    </div>

    <!-- LEGACY LAYOUT ELEMENTS -->
    <div class="sidebar" id="sidebar">
        <img id="logo-sidebar" class="logo" src="" style="display:none;">
        <div class="widgets" id="widgets-sidebar"></div>
    </div>
    <div id="legacy-overlay">
        <img id="logo-overlay" class="logo" src="" style="display:none;">
        <div class="widgets" id="widgets-overlay"></div>
        <div class="ticker-wrap">
            <div class="ticker-title">DUYURU</div>
            <div class="ticker-content" id="ticker-text">Yükleniyor...</div>
        </div>
    </div>

    <audio id="local-audio" style="display:none;"></audio>

    <!-- YouTube API Script -->
    <script>
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var player;
        var currentVideoId = "";
        var currentAudioPriority = "video";
        var currentMediaSource = "";
        var ytReady = false;
        var isPlayerInitialized = false;
        
        var localVideoList = [];
        var localAudioList = [];
        var currentLocalVideoIndex = 0;
        var currentLocalAudioIndex = 0;

        function onYouTubeIframeAPIReady() { ytReady = true; }

        const vidEl = document.getElementById('local-video');
        const audEl = document.getElementById('local-audio');
        const recordPlayer = document.getElementById('record-player');

        vidEl.onended = () => {
            if(localVideoList.length > 0) {
                currentLocalVideoIndex = (currentLocalVideoIndex + 1) % localVideoList.length;
                vidEl.src = localVideoList[currentLocalVideoIndex];
                vidEl.play().catch(e=>{});
            }
        };

        audEl.onended = () => {
            if(localAudioList.length > 0) {
                currentLocalAudioIndex = (currentLocalAudioIndex + 1) % localAudioList.length;
                audEl.src = localAudioList[currentLocalAudioIndex];
                audEl.play().catch(e=>{});
            }
        };

        audEl.onplay = () => { recordPlayer.style.display = 'block'; recordPlayer.classList.add('spinning'); };
        audEl.onpause = () => { recordPlayer.style.display = 'none'; recordPlayer.classList.remove('spinning'); };

        function switchSource(sourceType) {
            currentMediaSource = sourceType;
            if(sourceType === 'local') {
                document.getElementById('ytplayer').style.display = 'none';
                document.getElementById('local-video').style.display = 'block';
                if(player && player.pauseVideo) player.pauseVideo();
            } else {
                document.getElementById('ytplayer').style.display = 'block';
                document.getElementById('local-video').style.display = 'none';
                vidEl.pause();
                audEl.pause();
                if(player && player.playVideo) player.playVideo();
            }
        }

        function initYTPlayer(videoId, priority) {
            currentVideoId = videoId;
            currentAudioPriority = priority;
            let playerVars = { 'autoplay': 1, 'controls': 0, 'rel': 0, 'showinfo': 0, 'loop': 1, 'mute': (priority === 'music' ? 1 : 0) };
            if(videoId.startsWith('PL')) { playerVars['listType'] = 'playlist'; playerVars['list'] = videoId; }
            else { playerVars['playlist'] = videoId; }
            
            player = new YT.Player('ytplayer', {
                height: '100%', width: '100%',
                videoId: videoId.startsWith('PL') ? '' : videoId,
                playerVars: playerVars,
                events: {
                    'onReady': (e) => {
                        if(currentMediaSource === 'youtube') {
                            e.target.playVideo();
                            if(currentAudioPriority === 'music') e.target.mute();
                            else e.target.unMute();
                        }
                    },
                    'onStateChange': (e) => { if (e.data === YT.PlayerState.ENDED) player.playVideo(); }
                }
            });
        }
    </script>

    <!-- Main App Logic -->
    <script>
        let lastSettingsStr = "";
        let currentMessages = [];
        let basePromoText = "";
        let webProducts = [];
        
        let pIndex = 0;
        let mIndex = 0;

        function updateClock() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString('tr-TR', {hour: '2-digit', minute:'2-digit'});
            document.querySelectorAll('.clock-text').forEach(el => el.textContent = timeStr);
            document.getElementById('ml-clock').textContent = timeStr;
        }
        setInterval(updateClock, 1000);

        const wCodeMap = {
            0: '☀️', 1: '🌤️', 2: '⛅', 3: '☁️', 
            45: '🌫️', 48: '🌫️', 51: '🌦️', 53: '🌦️', 55: '🌧️', 
            61: '🌧️', 63: '🌧️', 65: '🌧️', 71: '🌨️', 73: '🌨️', 75: '❄️', 
            80: '🌧️', 81: '⛈️', 82: '⛈️', 95: '🌩️', 96: '⛈️', 99: '⛈️'
        };

        async function fetchWeather() {
            try {
                // İstanbul koordinatları (varsayılan)
                const res = await fetch("https://api.open-meteo.com/v1/forecast?latitude=41.0082&longitude=28.9784&daily=weathercode,temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=2");
                const data = await res.json();
                if(data && data.daily) {
                    const todayCode = data.daily.weathercode[0];
                    const todayMax = Math.round(data.daily.temperature_2m_max[0]);
                    const todayMin = Math.round(data.daily.temperature_2m_min[0]);
                    const tomCode = data.daily.weathercode[1];
                    const tomMax = Math.round(data.daily.temperature_2m_max[1]);
                    
                    const todayIcon = wCodeMap[todayCode] || '🌤️';
                    const tomIcon = wCodeMap[tomCode] || '🌤️';
                    
                    document.getElementById('ml-weather').innerHTML = `
                        <span style="font-weight:700;">Bugün: ${todayIcon} ${todayMin}° / ${todayMax}°C</span>
                        <span style="font-size:1vw; color:#4a5568;">Yarın: ${tomIcon} ${tomMax}°C</span>
                    `;
                }
            } catch(e) {
                console.error("Hava durumu çekilemedi", e);
            }
        }
        fetchWeather();
        setInterval(fetchWeather, 3600000); // Saat başı yenile

        function rotateContent() {
            if(webProducts.length > 0) {
                const slides = document.querySelectorAll('.product-slide');
                if(slides.length > 0) {
                    slides.forEach(s => s.classList.remove('active'));
                    slides[pIndex].classList.add('active');
                    pIndex = (pIndex + 1) % slides.length;
                }
            }
            if(currentMessages.length > 0) {
                const slides = document.querySelectorAll('.msg-slide');
                if(slides.length > 0) {
                    slides.forEach(s => s.classList.remove('active'));
                    slides[mIndex].classList.add('active');
                    mIndex = (mIndex + 1) % slides.length;
                }
            }
        }
        setInterval(rotateContent, 10000);

        function updateTickerText() {
            let finalText = basePromoText;
            const now = new Date();
            const currentMin = now.getHours() * 60 + now.getMinutes();
            currentMessages.forEach(msg => {
                if(msg.start_time && msg.end_time) {
                    const [sh, sm] = msg.start_time.split(':');
                    const [eh, em] = msg.end_time.split(':');
                    const startMin = parseInt(sh)*60 + parseInt(sm);
                    const endMin = parseInt(eh)*60 + parseInt(em);
                    if(currentMin >= startMin && currentMin <= endMin) {
                        if(finalText) finalText += "  •  ";
                        finalText += msg.text;
                    }
                }
            });
            if(!finalText) finalText = "Hoş Geldiniz...";
            
            // Legacy ticker
            const tickerEl = document.getElementById('ticker-text');
            if (tickerEl.textContent !== finalText) {
                tickerEl.textContent = finalText;
                tickerEl.style.animation = 'none'; tickerEl.offsetHeight; tickerEl.style.animation = null; 
            }
            
            // Modern grid ticker
            const mlTicker = document.getElementById('ml-ticker-text');
            if (mlTicker.textContent !== finalText) {
                mlTicker.textContent = finalText;
                mlTicker.style.animation = 'none'; mlTicker.offsetHeight; mlTicker.style.animation = null;
            }
        }
        setInterval(updateTickerText, 20000); 

        async function fetchProducts() {
            try {
                const res = await fetch('/api/tv/products');
                webProducts = await res.json();
                
                let html = "";
                webProducts.forEach((p, idx) => {
                    let tagsHtml = (p.tags||[]).map(t => `<span class="prod-tag">${t}</span>`).join('');
                    html += `
                        <div class="product-slide ${idx===0?'active':''}">
                            <img src="/${p.image_url}" class="prod-img" onerror="this.src='/static/img/placeholder.webp';">
                            <div class="prod-info">
                                <div class="prod-title">${p.title}</div>
                                <div class="prod-desc">${p.description}</div>
                                <div class="prod-tags" style="margin-top:auto;">${tagsHtml}</div>
                                <div class="prod-price">${p.price}</div>
                            </div>
                        </div>
                    `;
                });
                document.getElementById('product-carousel').innerHTML = html;
            } catch(e) {}
        }

        async function fetchSettings() {
            try {
                fetch('/api/tv/ping', {method: 'POST'}).catch(e=>{});
                const res = await fetch('/api/tv/settings');
                const data = await res.json();
                const dataStr = JSON.stringify(data);
                if (dataStr !== lastSettingsStr) {
                    lastSettingsStr = dataStr;
                    applySettings(data);
                }
            } catch (e) { console.log(e); }
        }

        function applySettings(data) {
            const layout = data.layout || 'modern_grid';
            document.body.className = `layout-${layout}`;
            
            if(data.logo_url) {
                document.getElementById('ml-logo').src = data.logo_url;
                document.getElementById('ml-logo').style.display = 'block';
                document.getElementById('logo-overlay').src = data.logo_url;
                document.getElementById('logo-sidebar').src = data.logo_url;
            }

            basePromoText = data.promo_text || "";
            currentMessages = data.messages || [];
            updateTickerText();
            
            if(currentMessages.length > 0) {
                let mHtml = "";
                currentMessages.forEach((m, idx) => {
                    if (m.image) {
                        mHtml += `<div class="msg-slide ${idx===0?'active':''}" style="flex-direction:row; gap:1.5vw;">
                                    <img src="${m.image}" style="max-height:80%; max-width:40%; border-radius:0.5vw; object-fit:cover;" onerror="this.style.display='none'">
                                    <div>${m.text}</div>
                                  </div>`;
                    } else {
                        mHtml += `<div class="msg-slide ${idx===0?'active':''}">${m.text}</div>`;
                    }
                });
                document.getElementById('message-carousel').innerHTML = mHtml;
            }

            let widgetsHtml = "";
            if (data.widgets && data.widgets.clock) widgetsHtml += `<div class="clock-widget clock-text">00:00</div>`;
            if (data.qr_code) {
                let qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(data.qr_code)}`;
                widgetsHtml += `<div class="qr-box"><img src="${qrUrl}" alt="QR"><div class="qr-text">${data.qr_text || 'Okutun'}</div></div>`;
            }
            document.getElementById('widgets-sidebar').innerHTML = layout==='sidebar' ? widgetsHtml : '';
            document.getElementById('widgets-overlay').innerHTML = layout==='default' ? widgetsHtml : '';
            
            updateClock();

            const mediaSource = data.media_source || 'youtube';
            switchSource(mediaSource);
            currentAudioPriority = data.audio_priority || 'video';

            if(mediaSource === 'local') {
                const oldVidList = JSON.stringify(localVideoList);
                const oldAudList = JSON.stringify(localAudioList);
                
                localVideoList = data.local_videos || [];
                localAudioList = data.local_audio || [];

                if (JSON.stringify(localVideoList) !== oldVidList && localVideoList.length > 0) {
                    currentLocalVideoIndex = 0;
                    vidEl.src = localVideoList[0];
                    vidEl.play().catch(e=>{});
                }
                
                if(currentAudioPriority === 'music' && localAudioList.length > 0) {
                    vidEl.muted = true;
                    if (JSON.stringify(localAudioList) !== oldAudList) {
                        currentLocalAudioIndex = 0;
                        audEl.src = localAudioList[0];
                    }
                    audEl.play().catch(e=>{});
                } else {
                    vidEl.muted = false;
                    audEl.pause();
                }
                if (localVideoList.length === 0) vidEl.pause();
            } else {
                if (data.video_playlist && data.video_playlist !== currentVideoId) {
                    if(isPlayerInitialized && player && player.loadPlaylist) {
                        if(data.video_playlist.startsWith('PL')) player.loadPlaylist({list: data.video_playlist, listType: 'playlist'});
                        else player.loadVideoById(data.video_playlist);
                        currentVideoId = data.video_playlist;
                    } else if (!isPlayerInitialized && ytReady && window.YT && window.YT.Player) {
                        initYTPlayer(data.video_playlist, data.audio_priority);
                        isPlayerInitialized = true;
                    }
                }
                if (isPlayerInitialized && player && player.mute) {
                    if (data.audio_priority === 'music') player.mute();
                    else player.unMute();
                }
            }
        }

        fetchProducts();
        setInterval(fetchSettings, 5000); 
        setTimeout(fetchSettings, 1000); 

        document.body.addEventListener('click', () => {
            if(currentMediaSource === 'local') {
                if(localVideoList.length > 0) vidEl.play().catch(e=>{});
                if(currentAudioPriority === 'music' && localAudioList.length > 0) audEl.play().catch(e=>{});
            } else if (currentMediaSource === 'youtube') {
                if(player && player.playVideo) player.playVideo();
                if (currentAudioPriority === 'video' && player && player.unMute) player.unMute();
            }
        });
    </script>
</body>
</html>
