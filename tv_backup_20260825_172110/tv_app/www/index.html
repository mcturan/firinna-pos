<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>Fırınna TV (Dijital Tabela)</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px 20px; background: #000; color: #fff; margin: 0; }
        input { padding: 10px; font-size: 16px; width: 80%; max-width: 300px; border-radius: 8px; border: 2px solid #555; margin-bottom: 20px; background: #222; color: white;}
        button { padding: 12px 24px; font-size: 16px; border-radius: 8px; border: none; background: #2d6a4f; color: white; cursor: pointer; font-weight: bold; }
        #splash { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: flex; align-items: center; justify-content: center; flex-direction: column; color: white; z-index: 9999; }
        #splash h1 { font-size: 3rem; margin: 0; letter-spacing: 2px; color: #2d6a4f; }
        #splash p { margin: 5px 0 0; opacity: 0.8; font-size: 1.1rem; }
    </style>
</head>
<body>
    <div id="splash">
        <h1>FIRINNA TV</h1>
        <p>Bağlanıyor...</p>
    </div>

    <div id="setup" style="display:none; padding-top: 50px;">
        <h2 style="color:#2d6a4f;">Sunucu IP Adresi</h2>
        <p>POS bilgisayarının IP adresini giriniz (Örn: 192.168.1.100)</p>
        <input type="text" id="ipInput" placeholder="192.168.1.100" />
        <br>
        <button onclick="saveAndGo()">Kaydet ve Başla</button>
    </div>
    
    <script>
        const splashStart = Date.now();
        const MIN_SPLASH_TIME = 1500;

        function doRedirect(url) {
            const elapsed = Date.now() - splashStart;
            const remaining = Math.max(0, MIN_SPLASH_TIME - elapsed);
            setTimeout(() => {
                window.location.replace(url);
            }, remaining);
        }

        function saveAndGo() {
            var ip = document.getElementById('ipInput').value.trim();
            if(ip) {
                localStorage.setItem("server_ip", ip);
                window.location.replace("http://" + ip + ":5000/tv-player");
            }
        }
        
        var savedIp = localStorage.getItem("server_ip");
        const APP_VERSION = "1.0.0"; // TV App initial version

        if (savedIp) {
            var serverUrl = "http://" + savedIp + ":5000";
            // Check for general API to see if reachable
            fetch(serverUrl + "/api/mobile_version")
                .then(r => r.json())
                .then(data => {
                    // We can use same update logic, or a separate tv_version api. Let's just launch it.
                    doRedirect(serverUrl + "/tv-player");
                })
                .catch(err => {
                    console.error("Sunucuya ulaşılamadı:", err);
                    document.getElementById('splash').innerHTML = `
                        <h1 style="color:#e53e3e">BAĞLANTI HATASI</h1>
                        <p>Sunucuya bağlanılamadı. Kasa bilgisayarı açık mı?</p>
                        <p style="color:#888; font-size:14px; margin-top:20px;">IP: ${savedIp}</p>
                        <button onclick="localStorage.removeItem('server_ip'); location.reload();" style="margin-top:20px; background:#444;">IP Sıfırla</button>
                        <button onclick="location.reload()" style="margin-top:20px; margin-left:10px;">Tekrar Dene</button>
                    `;
                });
        } else {
            document.getElementById('splash').style.display = 'none';
            document.getElementById('setup').style.display = 'block';
        }
    </script>
</body>
</html>
