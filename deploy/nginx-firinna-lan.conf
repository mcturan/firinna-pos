# LAN erişimi için port 5000 - video dosyalarını Nginx doğrudan serve eder
server {
    listen 5000;
    server_name _;

    # --- Büyük video dosyaları: Nginx doğrudan serve eder (gunicorn'u bypass) ---
    location /static/tv_media/ {
        alias /opt/firinna-pos/static/tv_media/;
        add_header Accept-Ranges bytes;
        add_header Cache-Control "public, max-age=86400";
        add_header Access-Control-Allow-Origin "*";
        gzip off;
        sendfile on;
        tcp_nopush on;
    }

    # --- APK indirmeleri de doğrudan Nginx'ten ---
    location /static/ {
        alias /opt/firinna-pos/static/;
        add_header Accept-Ranges bytes;
        add_header Access-Control-Allow-Origin "*";
    }

    # --- Geri kalanı gunicorn'a ilet ---
    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120;
        proxy_connect_timeout 10;
        client_max_body_size 50M;
    }
}
