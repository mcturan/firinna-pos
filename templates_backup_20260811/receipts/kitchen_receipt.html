<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Mutfak - {{ order['table_name'] }}</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html {
            background-color: #f4f4f5;
        }
        body {
            font-family: Arial, sans-serif;
            font-size: 14px;
            width: 300px;
            margin: 30px auto;
            padding: 24px 16px;
            background: #fff;
            position: relative;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.08);
            border-left: 1px solid #e5e7eb;
            border-right: 1px solid #e5e7eb;
        }
        /* Kağıt yırtığı zigzag efekti */
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 8px;
            background-image: 
                linear-gradient(135deg, #f4f4f5 25%, transparent 25%), 
                linear-gradient(225deg, #f4f4f5 25%, transparent 25%);
            background-position: 0 0;
            background-size: 12px 16px;
            background-repeat: repeat-x;
            z-index: 10;
        }
        body::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 8px;
            background-image: 
                linear-gradient(45deg, #f4f4f5 25%, transparent 25%), 
                linear-gradient(315deg, #f4f4f5 25%, transparent 25%);
            background-position: 0 100%;
            background-size: 12px 16px;
            background-repeat: repeat-x;
            z-index: 10;
        }
        .header {
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }
        .sep { border: none; border-top: 2px solid #000; margin: 8px 0; }
        .sep-light { border: none; border-top: 1px dashed #666; margin: 6px 0; }
        .table-name {
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            margin: 8px 0 4px;
        }
        .time {
            text-align: center;
            font-size: 12px;
            color: #444;
            margin-bottom: 4px;
        }
        .item {
            margin: 8px 0;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .qty {
            font-size: 20px;
            font-weight: bold;
            line-height: 1.2;
        }
        .item-name {
            font-size: 16px;
            font-weight: bold;
        }
        .note {
            margin-top: 6px;
            padding: 4px 6px;
            background: #ffffcc;
            font-size: 13px;
            font-weight: bold;
            border-left: 3px solid #f0c040;
        }
        @media print {
            body { border: 2px solid #000; margin: 0; padding: 16px; width: 100%; box-shadow: none; }
            body::before, body::after { display: none; }
            html { background-color: #fff; }
        }
    </style>
</head>
<body>
    <div class="header">MUTFAK SIPARIS</div>
    <hr class="sep">
    <div class="table-name">MASA: {{ order['table_name'] }}</div>
    <div class="time">{{ order['closed_at'] or order['created_at'] }}</div>
    <hr class="sep">

    {% for item in order['items'] %}
    {% if not item.is_complimentary %}
    <div class="item">
        <span class="qty">{{ item.quantity }}x</span>
        <span class="item-name">{{ item.product_name }}</span>
        {% if item.kitchen_notes %}
        <div class="note">{{ item.kitchen_notes }}</div>
        {% endif %}
    </div>
    {% endif %}
    {% endfor %}
</body>
</html>
