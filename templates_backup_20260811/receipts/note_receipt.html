<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Not Fişi</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html {
            background-color: #f4f4f5;
        }
        body {
            font-family: 'Courier New', monospace;
            width: 300px;
            margin: 30px auto;
            padding: 24px 20px;
            background: #fff;
            position: relative;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.08);
            border-left: 1px solid #e5e7eb;
            border-right: 1px solid #e5e7eb;
        }
        /* Kağıt yırtığı zigzag efekti */
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 8px;
            background-image: 
                linear-gradient(135deg, #f4f4f5 25%, transparent 25%), 
                linear-gradient(225deg, #f4f4f5 25%, transparent 25%);
            background-position: 0 0;
            background-size: 12px 16px;
            background-repeat: repeat-x;
            z-index: 10;
        }
        body::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 8px;
            background-image: 
                linear-gradient(45deg, #f4f4f5 25%, transparent 25%), 
                linear-gradient(315deg, #f4f4f5 25%, transparent 25%);
            background-position: 0 100%;
            background-size: 12px 16px;
            background-repeat: repeat-x;
            z-index: 10;
        }
        .center { text-align: center; }
        .bold { font-weight: bold; }
        .separator { border-top: 1px dashed #000; margin: 10px 0; }
        .note-content {
            font-size: 1.1em;
            white-space: pre-wrap;
            word-break: normal;
            overflow-wrap: break-word;
            text-align: justify;
            margin: 12px 0;
            min-height: 60px;
        }
        @media print {
            body { border: none; margin: 0; padding: 10px; box-shadow: none; width: 100%; }
            body::before, body::after { display: none; }
            html { background-color: #fff; }
        }
    </style>
</head>
<body>
    <div class="center bold">{{ restaurant_name }}</div>
    <div class="separator"></div>
    <div class="center bold" style="font-size: 1.1em;">--- {{ title }} ---</div>
    <div style="font-size: 0.85em; color: #555; margin-top: 4px;">{{ timestamp }}</div>
    <div class="separator"></div>
    <div class="note-content" dir="auto">{{ note }}</div>
    <div class="separator"></div>
    {% if qr_image_url %}
    <div class="center" style="margin-top:8px;">
        <img src="{{ qr_image_url }}" style="max-width:140px;max-height:140px;">
        {% if qr_label %}
        <div style="font-size:0.8em;margin-top:4px;">{{ qr_label }}</div>
        {% endif %}
    </div>
    <div class="separator"></div>
    {% endif %}
</body>
</html>
