<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>Fırınna Garson</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px 20px; background: #f8fafc; margin: 0; }
        input { padding: 10px; font-size: 16px; width: 80%; max-width: 300px; border-radius: 8px; border: 2px solid #ccc; margin-bottom: 20px; }
        button { padding: 12px 24px; font-size: 16px; border-radius: 8px; border: none; background: #2d6a4f; color: white; cursor: pointer; font-weight: bold; }
        #splash { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #2d6a4f; display: flex; align-items: center; justify-content: center; flex-direction: column; color: white; z-index: 9999; }
        #splash h1 { font-size: 3rem; margin: 0; letter-spacing: 2px; }
        #splash p { margin: 5px 0 0; opacity: 0.8; font-size: 1.1rem; }
    </style>
</head>
<body>
    <div id="splash">
        <h1>FIRINNA</h1>
        <p>POS & Sipariş</p>
    </div>

    <div id="setup" style="display:none; padding-top: 30px;">
        <h2 style="color:#2d6a4f;">Sunucu Ayarları</h2>
        <p style="margin-bottom:5px;">Lokal IP (WiFi, Restoran İçi)</p>
        <input type="text" id="ipInput" placeholder="Örn: 192.168.1.100" />
        <p style="margin-bottom:5px;">Uzak IP (Hücresel/WAN)</p>
        <input type="text" id="wanInput" placeholder="Örn: 84.17.86.208" />
        <br>
        <button onclick="saveAndGo()">Kaydet ve Başla</button>
    </div>
    
    <script>
        const splashStart = Date.now();
        const MIN_SPLASH_TIME = 500;

        const APP_VERSION = "1.5.5";

        function doRedirect(url) {
            if(url.indexOf('app_version=') === -1) {
                url += (url.indexOf('?') === -1 ? '?' : '&') + 'app_version=' + APP_VERSION;
            }
            const elapsed = Date.now() - splashStart;
            const remaining = Math.max(0, MIN_SPLASH_TIME - elapsed);
            setTimeout(() => {
                window.location.replace(url);
            }, remaining);
        }

        function saveAndGo() {
            var ip = document.getElementById('ipInput').value.trim();
            var wan = document.getElementById('wanInput').value.trim();
            if(ip) {
                localStorage.setItem("server_ip", ip);
                if(wan) localStorage.setItem("wan_ip", wan);
                doRedirect("http://" + ip + ":5000/?mode=garson");
            }
        }
        
        var savedIp = localStorage.getItem("server_ip");
        var savedWan = localStorage.getItem("wan_ip") || "84.17.86.208";

        if (savedIp) {
            var lanUrl = "http://" + savedIp + ":5000";
            var wanUrl = "http://" + savedWan + ":5000";
            
            // 1.5 saniye içinde LAN yanıt vermezse WAN'a geç
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 1500);
            
            fetch(lanUrl + "/api/mobile_version?_=" + Date.now(), { signal: controller.signal })
                .then(r => r.json())
                .then(data => {
                    clearTimeout(timeoutId);
                    // Sunucuya LAN'dan erişildi
                    doRedirect(lanUrl + "/?mode=garson");
                })
                .catch(err => {
                    clearTimeout(timeoutId);
                    console.log("Lokal IP'ye bağlanılamadı, Hücresel (WAN IP) deneniyor...", err);
                    doRedirect(wanUrl + "/?mode=garson");
                });
        } else {
            document.getElementById('splash').style.display = 'none';
            document.getElementById('setup').style.display = 'block';
        }
    </script>
</body>
</html>
