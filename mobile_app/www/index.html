<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>Fırınna Garson</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px 20px; background: #f8fafc; }
        input { padding: 10px; font-size: 16px; width: 80%; max-width: 300px; border-radius: 8px; border: 2px solid #ccc; margin-bottom: 20px; }
        button { padding: 12px 24px; font-size: 16px; border-radius: 8px; border: none; background: #2d6a4f; color: white; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div id="setup" style="display:none;">
        <h2>Sunucu IP Adresi</h2>
        <p>Bilgisayarın IP adresini giriniz (Örn: 192.168.1.100)</p>
        <input type="text" id="ipInput" placeholder="192.168.1.100" />
        <br>
        <button onclick="saveAndGo()">Kaydet ve Başla</button>
    </div>
    
    <script>
        function saveAndGo() {
            var ip = document.getElementById('ipInput').value.trim();
            if(ip) {
                localStorage.setItem("server_ip", ip);
                window.location.replace("http://" + ip + ":5000/?mode=garson");
            }
        }
        
        var savedIp = localStorage.getItem("server_ip");
        const APP_VERSION = "1.4.1";

        if (savedIp) {
            var serverUrl = "http://" + savedIp + ":5000";
            fetch(serverUrl + "/api/mobile_version")
                .then(r => r.json())
                .then(data => {
                    if (parseFloat(data.version) > parseFloat(APP_VERSION)) {
                        alert("Yeni bir güncelleme mevcut. İndirme başlıyor. Lütfen indirme bitince kurunuz.");
                        window.location.href = serverUrl + data.apk_url;
                        // Give user a button to proceed manually if they already updated but cache says otherwise or if they just want to skip for now
                        document.body.innerHTML = '<div style="padding: 50px;"><h3>Güncelleme İndiriliyor...</h3><p>Uygulamayı kurduktan sonra baştan başlatın.</p><button onclick="window.location.replace(\'' + serverUrl + '/?mode=garson\')">Geç ve Devam Et</button></div>';
                    } else {
                        window.location.replace(serverUrl + "/?mode=garson");
                    }
                })
                .catch(err => {
                    console.error("Versiyon kontrolü başarısız:", err);
                    window.location.replace(serverUrl + "/?mode=garson");
                });
        } else {
            document.getElementById('setup').style.display = 'block';
        }
    </script>
</body>
</html>
